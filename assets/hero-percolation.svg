<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="渗流阈值：左侧未连通，右侧出现分层贯通簇">
<style>
<![CDATA[
@keyframes pc-in { 0%{fill-opacity:.06} 60%{fill-opacity:1} 100%{fill-opacity:.88} }
@keyframes br-slow { 0%{fill-opacity:.28} 50%{fill-opacity:.72} 100%{fill-opacity:.28} }
@keyframes br-fast { 0%{fill-opacity:.45} 50%{fill-opacity:1} 100%{fill-opacity:.45} }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes twitch { 0%{transform:translate(0,0)} 12%{transform:translate(-3px,1px)}
                    24%{transform:translate(3px,-1px)} 36%{transform:translate(-2px,0)}
                    100%{transform:translate(0,0)} }
@keyframes warm { 0%{fill-opacity:1} 35%{fill-opacity:.9} 100%{fill-opacity:.3} }
@keyframes freeze { 0%,100%{fill-opacity:.42} }
.pc-L { animation: pc-in 2.4s ease-out both; }
.pc-R { animation: pc-in 2.4s ease-out both; }
.pc-S { animation: pc-in 1.8s ease-out both; }
.br-L { animation: br-slow 4s ease-in-out infinite; }
.br-R { animation: br-slow 4s ease-in-out infinite; }
.br-S { animation: br-slow 4s ease-in-out infinite; }
.br-fast { animation: br-fast .8s ease-in-out infinite; }
.br-frozen { animation: freeze .1s linear infinite; }
.br-warm { animation: warm 3s ease-out forwards; }
.tw-once { animation: twitch .6s ease-out 1 both; }
.ring { animation: spin 14s linear infinite; transform-origin: 600px 220px; }
]]>
</style>
