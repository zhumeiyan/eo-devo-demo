<style>
 text{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
 .lbl{font-size:26px;font-weight:600;letter-spacing:1px;}
 .sub{font-size:20px;}
 .tick{font-size:18px;}
 .k{font-size:15px;letter-spacing:.5px;}
 .cap{font-size:22px;font-weight:600;}
 .capd{font-size:17px;}
 .halo{opacity:.10;}

 .ag{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);
   animation:agrow 0.55s ease-out forwards;}
 @keyframes agrow{to{stroke-dashoffset:0;}}
 .an{opacity:0;animation:apop .4s ease-out forwards;}
 @keyframes apop{to{opacity:1;}}

 .bg{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);
   animation:bgrow 0.55s ease-out forwards;}
 @keyframes bgrow{to{stroke-dashoffset:0;}}
 .bn{opacity:0;animation:bpop .4s ease-out forwards;}
 @keyframes bpop{to{opacity:1;}}
.ring{transform-origin:300px 220px;animation:rot 24s linear infinite;}@keyframes rot{to{transform:rotate(360deg);}}.ring2{transform-origin:860px 220px;animation:rot 16s linear infinite;}</style>
