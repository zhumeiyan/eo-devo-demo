<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" width="1440" height="320"
     role="img" aria-label="EO devo 状态立面">
  <title>EO devo 状态立面</title>
  <style>

  .idle .ring { animation: br 4.0s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes br { from { opacity: 0.3; stroke: #3d7a5a; } to { opacity: 0.72; stroke: #66b98a; } }
  .idle .core { animation: cr 4.0s ease-in-out infinite alternate; }
  @keyframes cr { from { opacity: 0.24; } to { opacity: 0.58; } }

  .thinking .ring { animation: pf 0.8s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes pf { from { opacity: 0.45; stroke: #9c6416; } to { opacity: 1.0; stroke: #d9a441; } }
  .thinking .core { animation: cf 0.8s ease-in-out infinite alternate; }
  @keyframes cf { from { opacity: 0.32; } to { opacity: 0.90; } }

  .busy .ring { animation: sp 2.4s linear infinite; transform-origin: center; stroke: #7fd8c8; }
  @keyframes sp { from { transform: rotate(0deg); opacity: 0.75; }
                  to   { transform: rotate(360deg); opacity: 1.00; } }
  .busy .core { animation: rp 2.4s linear infinite; }
  @keyframes rp { from { opacity: 1.00; } to { opacity: 0.75; } }
  .busy .wave { animation: wv 2.4s ease-out infinite; }
  @keyframes wv { from { r: 0.32; opacity: 0.55; } to { r: 0.62; opacity: 0.0; } }

  .blocked .ring { opacity: 0.42; stroke: #7a4343; }
  .blocked .core { opacity: 0.25; }
  /* 冻结：脉冲停摆，刻意低饱和 —— 受阻不等于失败 */

  .error .ring { opacity: 1.0; stroke: #b3322a; animation: tw 0.9s steps(1,end) forwards; transform-origin: center; }
  @keyframes tw { 0% { transform: translate(0,0); }
                   8% { transform: translate(-2.2, 0); }
                   16% { transform: translate(1.6, 0.6); }
                   24% { transform: translate(-0.8, -0.4); }
                   100% { transform: translate(0,0); } }
  .error .core { opacity: 0.95; }
  /* 一次抽动后静止 */

  .success .ring { animation: wd 3.0s ease-out forwards; stroke: #f0c76a; transform-origin: center; }
  @keyframes wd { 0% { opacity: 1.0; } 18% { opacity: 0.30; }
                  100% { opacity: 1.00; stroke: #c99a3f; } }
  .success .core { animation: wd2 3.0s ease-out forwards; }
  @keyframes wd2 { 0% { opacity: 1.0; } 100% { opacity: 0.60; } }
  /* 暖脉冲后回落 idle —— 不常驻 */
  .line { fill: none; stroke: #8b949e; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  .ring { fill: none; stroke-width: 2.0; }
  .core { fill: #e6edf3; }
  text { font-family: "WenQuanYi Micro Hei", system-ui, -apple-system, "PingFang SC", sans-serif; }
  </style>
